# Synapse Helm chart values
#
# Default image registry is Omni's internal Manifold registry. Self-hosters
# without access should override with the public mirror, e.g.
# --set gateway.image.repository=ghcr.io/omnidotdev/synapse
# --set api.image.repository=ghcr.io/omnidotdev/synapse-api
# --set app.image.repository=ghcr.io/omnidotdev/synapse-app

# -- Image pull secrets for private registries, rendered into every pod spec.
# List of objects, e.g. [{name: my-registry-creds}]
imagePullSecrets: []

# -- Gateway (AI router)
gateway:
  image:
    repository: manifold.omni.dev/omni/synapse
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicas: 1
  port: 3000
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # -- Pod-level security context. The gateway image runs as uid/gid 1000 (synapse)
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  # -- Container-level security context. The gateway is stateless and writes only
  # to mounted emptyDir volumes, so the root filesystem is read-only
  securityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  # Provider API keys
  providers:
    openai: ""
    anthropic: ""
    google: ""
    nvidia: ""
    deepgram: ""
    elevenlabs: ""
    brave: ""
    bedrock:
      enabled: false
      region: us-east-1
      accessKeyId: ""
      secretAccessKey: ""
  # Aether billing (optional, enables usage metering)
  billing:
    enabled: false
    aetherUrl: ""
    aetherServiceApiKey: ""
  # -- Override auto-generated gateway TOML with a complete custom config.
  # When set, this value is rendered directly as synapse.toml, replacing the
  # auto-generated stub. Use --set-file gateway.configOverride=path/to/file.toml
  configOverride: ""

# -- API (GraphQL + PostGraphile)
api:
  image:
    repository: manifold.omni.dev/omni/synapse-api
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicas: 1
  port: 4000
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # -- Pod-level security context. The api image runs as uid/gid 1001 (synapse)
  podSecurityContext:
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
  # -- Container-level security context. The api is stateless with a read-only root filesystem
  securityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  corsAllowedOrigins: ""
  # JWT verification via Gatekeeper. Defaults off for self-hosted; enable with
  # --set api.protectRoutes=true when running behind an OIDC IdP.
  protectRoutes: false
  auth:
    baseUrl: ""
  billing:
    baseUrl: ""
  authz:
    apiUrl: ""
    enabled: false

# -- App (Dashboard)
app:
  image:
    repository: manifold.omni.dev/omni/synapse-app
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicas: 1
  port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # -- Pod-level security context. The app image runs as uid/gid 1001 (synapse)
  podSecurityContext:
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
  # -- Container-level security context. The app is stateless with a read-only root filesystem
  securityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  baseUrl: ""
  auth:
    baseUrl: ""
    internalUrl: ""
    clientId: ""
    clientSecret: ""
  billing:
    baseUrl: ""
  authz:
    apiUrl: ""
    enabled: false

# -- Secrets (required)
secrets:
  # Generate with: openssl rand -hex 32
  authSecret: ""
  gatewaySecret: ""
  # Generate with: openssl rand -base64 32
  encryptionKey: ""
  # Aether service API key (shared by gateway + api + app)
  aetherServiceApiKey: ""
  # HMAC secret for billing webhook verification
  billingWebhookSecret: ""
  # HMAC secret for IDP webhook verification
  authWebhookSecret: ""

# -- Valkey (distributed rate limiting + response cache)
valkey:
  enabled: true
  image:
    repository: valkey/valkey
    tag: 8-alpine
  port: 6379
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # -- Pod-level security context. The valkey image runs as uid 999, gid 1000 (valkey)
  podSecurityContext:
    runAsUser: 999
    runAsGroup: 1000
    fsGroup: 1000
  # -- Container-level security context. readOnlyRootFilesystem is intentionally
  # omitted because valkey writes to its data directory
  securityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  persistence:
    size: 1Gi

# -- External Valkey (when valkey.enabled=false)
externalValkey:
  url: ""

# -- PostgreSQL (Bitnami subchart)
postgresql:
  enabled: true
  auth:
    database: synapse
    username: postgres
    # Generate with: openssl rand -hex 32
    password: ""
  primary:
    persistence:
      size: 10Gi

# -- External database (when postgresql.enabled=false)
externalDatabase:
  host: ""
  port: 5432
  database: synapse
  username: postgres
  password: ""

# -- Ingress
ingress:
  enabled: false
  className: ""
  annotations: {}
  gateway:
    host: gateway.synapse.example.com
  api:
    host: api.synapse.example.com
  app:
    host: synapse.example.com
  tls: []
