apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "synapse.fullname" . }}-gateway
  labels:
    {{- include "synapse.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      {{- include "synapse.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "synapse.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          args: ["--config", "/etc/synapse/synapse.toml", "--listen", "0.0.0.0:{{ .Values.gateway.port }}"]
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
              protocol: TCP
          env:
            - name: GATEWAY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "synapse.fullname" . }}
                  key: gateway-secret
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "synapse.fullname" . }}
                  key: openai-api-key
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "synapse.fullname" . }}
                  key: anthropic-api-key
                  optional: true
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "synapse.fullname" . }}
                  key: google-api-key
                  optional: true
            - name: NVIDIA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "synapse.fullname" . }}
                  key: nvidia-api-key
                  optional: true
            - name: DEEPGRAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "synapse.fullname" . }}
                  key: deepgram-api-key
                  optional: true
            - name: ELEVENLABS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "synapse.fullname" . }}
                  key: elevenlabs-api-key
                  optional: true
            - name: BRAVE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "synapse.fullname" . }}
                  key: brave-api-key
                  optional: true
            {{- if .Values.gateway.providers.bedrock.enabled }}
            - name: AWS_REGION
              value: {{ .Values.gateway.providers.bedrock.region | default "us-east-1" | quote }}
            {{- if .Values.gateway.providers.bedrock.accessKeyId }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "synapse.fullname" . }}
                  key: aws-access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "synapse.fullname" . }}
                  key: aws-secret-access-key
            {{- end }}
            {{- end }}
            - name: VALKEY_URL
              value: {{ include "synapse.valkeyUrl" . | quote }}
            {{- if .Values.gateway.billing.enabled }}
            - name: BILLING_URL
              value: {{ .Values.gateway.billing.aetherUrl | quote }}
            {{- if .Values.secrets.aetherServiceApiKey }}
            - name: BILLING_SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "synapse.fullname" . }}
                  key: aether-service-api-key
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/synapse
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "synapse.fullname" . }}-config
