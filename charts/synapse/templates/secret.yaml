apiVersion: v1
kind: Secret
metadata:
  name: {{ include "synapse.fullname" . }}
  labels:
    {{- include "synapse.labels" . | nindent 4 }}
type: Opaque
stringData:
  auth-secret: {{ .Values.secrets.authSecret | quote }}
  gateway-secret: {{ .Values.secrets.gatewaySecret | quote }}
  encryption-key: {{ .Values.secrets.encryptionKey | quote }}
  database-url: {{ include "synapse.databaseUrl" . | quote }}
  {{- with .Values.secrets.aetherServiceApiKey }}
  aether-service-api-key: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.billingWebhookSecret }}
  billing-webhook-secret: {{ . | quote }}
  {{- end }}
  {{- with .Values.gateway.providers.openai }}
  openai-api-key: {{ . | quote }}
  {{- end }}
  {{- with .Values.gateway.providers.anthropic }}
  anthropic-api-key: {{ . | quote }}
  {{- end }}
  {{- with .Values.gateway.providers.google }}
  google-api-key: {{ . | quote }}
  {{- end }}
  {{- with .Values.gateway.providers.nvidia }}
  nvidia-api-key: {{ . | quote }}
  {{- end }}
  {{- with .Values.gateway.providers.deepgram }}
  deepgram-api-key: {{ . | quote }}
  {{- end }}
  {{- with .Values.gateway.providers.elevenlabs }}
  elevenlabs-api-key: {{ . | quote }}
  {{- end }}
  {{- with .Values.gateway.providers.brave }}
  brave-api-key: {{ . | quote }}
  {{- end }}
  {{- with .Values.gateway.providers.bedrock.accessKeyId }}
  aws-access-key-id: {{ . | quote }}
  {{- end }}
  {{- with .Values.gateway.providers.bedrock.secretAccessKey }}
  aws-secret-access-key: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.authWebhookSecret }}
  auth-webhook-secret: {{ . | quote }}
  {{- end }}
  {{- with .Values.app.auth.clientSecret }}
  auth-client-secret: {{ . | quote }}
  {{- end }}
