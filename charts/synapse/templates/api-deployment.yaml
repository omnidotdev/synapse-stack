apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "synapse.fullname" . }}-api
  labels:
    {{- include "synapse.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "synapse.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "synapse.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "synapse.fullname" . }}
                  key: database-url
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "synapse.fullname" . }}
                  key: auth-secret
            - name: GATEWAY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "synapse.fullname" . }}
                  key: gateway-secret
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "synapse.fullname" . }}
                  key: encryption-key
            - name: PORT
              value: {{ .Values.api.port | quote }}
            - name: HOST
              value: "0.0.0.0"
            - name: NODE_ENV
              value: production
            {{- with .Values.api.corsAllowedOrigins }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.api.billing.baseUrl }}
            - name: BILLING_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.secrets.aetherServiceApiKey }}
            - name: BILLING_SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "synapse.fullname" . }}
                  key: aether-service-api-key
            {{- end }}
            {{- if .Values.secrets.billingWebhookSecret }}
            - name: BILLING_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "synapse.fullname" . }}
                  key: billing-webhook-secret
            {{- end }}
            {{- with .Values.api.authz.apiUrl }}
            - name: AUTHZ_API_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.api.authz.enabled }}
            - name: AUTHZ_ENABLED
              value: "true"
            {{- end }}
            - name: PROTECT_ROUTES
              value: "true"
            {{- with .Values.api.auth.baseUrl }}
            - name: AUTH_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.secrets.authWebhookSecret }}
            - name: AUTH_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "synapse.fullname" . }}
                  key: auth-webhook-secret
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
