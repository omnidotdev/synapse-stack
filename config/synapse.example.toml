# Synapse Configuration
#
# Copy to config/synapse.dev.toml and customize.
# Environment variables are expanded via env template syntax.
# Set required API keys in .env.local at the repo root.

[server]
# Use "0.0.0.0:3000" when running inside Docker (the compose config does this)
listen_address = "127.0.0.1:6000"

[server.health]
enabled = true
path = "/health"

# ------------------------------------
# LLM Providers
# ------------------------------------

[llm.providers.openai]
type = "openai"
api_key = "{{ env.OPENAI_API_KEY }}"

[llm.providers.anthropic]
type = "anthropic"
api_key = "{{ env.ANTHROPIC_API_KEY }}"

# Uncomment to enable additional providers:
# [llm.providers.google]
# type = "google"
# api_key = "{{ env.GOOGLE_API_KEY }}"

# [llm.providers.bedrock]
# type = "bedrock"
# region = "us-east-1"

# ------------------------------------
# Intelligent Routing
# ------------------------------------

[llm.routing]
enabled = true
strategy = "threshold"

[llm.routing.threshold]
low_complexity_model = "openai/gpt-4o-mini"
high_complexity_model = "anthropic/claude-sonnet-4-20250514"
quality_floor = 0.7

[[llm.routing.models]]
provider = "openai"
model = "gpt-4o-mini"
input_per_mtok = 0.15
output_per_mtok = 0.60
quality = 0.7
context_window = 128000
[llm.routing.models.capabilities]
tool_calling = true
vision = true

[[llm.routing.models]]
provider = "openai"
model = "gpt-4o"
input_per_mtok = 2.50
output_per_mtok = 10.00
quality = 0.88
context_window = 128000
[llm.routing.models.capabilities]
tool_calling = true
vision = true

[[llm.routing.models]]
provider = "anthropic"
model = "claude-sonnet-4-20250514"
input_per_mtok = 3.00
output_per_mtok = 15.00
quality = 0.92
context_window = 200000
[llm.routing.models.capabilities]
tool_calling = true
vision = true
long_context = true

# ------------------------------------
# Failover
# ------------------------------------

[llm.failover]
enabled = true
max_attempts = 2

[[llm.failover.equivalence_groups]]
name = "frontier"
models = ["openai/gpt-4o", "anthropic/claude-sonnet-4-20250514"]

[[llm.failover.equivalence_groups]]
name = "fast"
models = ["openai/gpt-4o-mini", "anthropic/claude-haiku-4-5-20251001"]

[llm.failover.circuit_breaker]
error_threshold = 5
window_seconds = 60
recovery_seconds = 30

# ------------------------------------
# Embeddings
# ------------------------------------

[embeddings.providers.openai]
type = "openai"
api_key = "{{ env.OPENAI_API_KEY }}"

# ------------------------------------
# Image Generation
# ------------------------------------

[imagegen.providers.openai]
type = "openai"
api_key = "{{ env.OPENAI_API_KEY }}"

# ------------------------------------
# Speech-to-Text
# ------------------------------------

[stt.providers.whisper]
type = "whisper"
api_key = "{{ env.OPENAI_API_KEY }}"

# Uncomment for Deepgram:
# [stt.providers.deepgram]
# type = "deepgram"
# api_key = "{{ env.DEEPGRAM_API_KEY }}"

# ------------------------------------
# Text-to-Speech
# ------------------------------------

[tts.providers.openai]
type = "openai_tts"
api_key = "{{ env.OPENAI_API_KEY }}"

# Uncomment for ElevenLabs:
# [tts.providers.elevenlabs]
# type = "elevenlabs"
# api_key = "{{ env.ELEVENLABS_API_KEY }}"

# ------------------------------------
# MCP Tool Servers
# ------------------------------------

# Uncomment to enable web search via Brave:
# [mcp.servers.brave_search.type]
# transport = "stdio"
# command = "npx"
# args = ["-y", "@anthropic-ai/mcp-server-brave-search"]
# env = { BRAVE_API_KEY = "{{ env.BRAVE_API_KEY }}" }

# Uncomment to enable web fetch:
# [mcp.servers.fetch.type]
# transport = "stdio"
# command = "npx"
# args = ["-y", "@anthropic-ai/mcp-server-fetch"]

# ------------------------------------
# API Key Authentication
# ------------------------------------

[auth]
enabled = true
api_url = "http://localhost:4000"
gateway_secret = "{{ env.GATEWAY_SECRET }}"
cache_ttl_seconds = 60
cache_capacity = 10000
public_paths = ["/health"]
