# Synapse self-hosting stack
# Copy .env.example to .env and fill in required values before running

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-synapse}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "${DB_PORT:-5432}:5432"

  valkey:
    image: valkey/valkey:8-alpine
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "${VALKEY_PORT:-6379}:6379"

  gateway:
    build: ./services/synapse-gateway
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      GATEWAY_SECRET: ${GATEWAY_SECRET:?GATEWAY_SECRET is required}
      AETHER_URL: ${AETHER_URL:-}
      AETHER_SERVICE_API_KEY: ${AETHER_SERVICE_API_KEY:-}
      VALKEY_URL: redis://valkey:6379
    volumes:
      - ./config/synapse.toml:/etc/synapse.toml:ro
    depends_on:
      api:
        condition: service_healthy
      valkey:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-6000}:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./services/synapse-api
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-synapse}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      GATEWAY_SECRET: ${GATEWAY_SECRET:?GATEWAY_SECRET is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      PORT: "4000"
      HOST: "0.0.0.0"
      NODE_ENV: ${NODE_ENV:-production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      BILLING_BASE_URL: ${BILLING_BASE_URL:-}
      AETHER_SERVICE_API_KEY: ${AETHER_SERVICE_API_KEY:-}
      BILLING_WEBHOOK_SECRET: ${BILLING_WEBHOOK_SECRET:-}
      AUTHZ_API_URL: ${AUTHZ_API_URL:-}
      AUTHZ_ENABLED: ${AUTHZ_ENABLED:-}
      PROTECT_ROUTES: "true"
      AUTH_BASE_URL: ${AUTH_BASE_URL:?AUTH_BASE_URL is required}
      AUTH_WEBHOOK_SECRET: ${AUTH_WEBHOOK_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: ./services/synapse-app
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      VITE_BASE_URL: ${VITE_BASE_URL:-http://localhost:3000}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://api:4000}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      VITE_AUTH_BASE_URL: ${VITE_AUTH_BASE_URL:-}
      AUTH_CLIENT_ID: ${AUTH_CLIENT_ID:-}
      AUTH_CLIENT_SECRET: ${AUTH_CLIENT_SECRET:-}
      VITE_BILLING_BASE_URL: ${VITE_BILLING_BASE_URL:-}
      BILLING_SERVICE_API_KEY: ${BILLING_SERVICE_API_KEY:-}
      VITE_AUTHZ_API_URL: ${VITE_AUTHZ_API_URL:-}
      VITE_AUTHZ_ENABLED: ${VITE_AUTHZ_ENABLED:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  db_data:
  valkey_data:
